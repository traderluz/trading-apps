<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CalcSpeed</title>

    <!-- Configuración básica PWA -->
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">

    <!-- iOS (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --color-entero: #00d4ff;
            --color-decimal: #ffb703;
            --key-bg: #1a1a1a;
            --gap-std: 8px;
            --gap-center: 14px;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
            padding-bottom: 20px;
            height: 100vh;
            box-sizing: border-box;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .calc {
            width: 98%;
            max-width: 450px;
        }

        /* Bloque discreto con los parámetros de la operativa */
        .operativa-mini {
            position: relative;
            width: 100%;
            font-size: 0.75rem;
            line-height: 1.1;
            color: #777;
            padding-left: 6px;
            box-sizing: border-box;
        }

        .operativa-mini span {
            display: block;
        }

        /* Que el bloque sea clicable */
        .operativa-mini span {
            cursor: pointer;
        }

        .display-container {
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 15px 0;
        }

        #result-val {
            font-size: 3.8rem;
            font-weight: bold;
            visibility: hidden;
            color: #ffffff;
            margin-top: 10px;
        }
        #result-val .span-punto {
            color: #ffffff !important;
        }

        #input-val {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .display-line {
            display: flex;
            justify-content: center;
            align-items: baseline;
            width: 100%;
        }
        .part-entero {
            flex: 1;
            text-align: right;
            padding-right: 4px;
        }
        .part-decimal {
            flex: 1;
            text-align: left;
            padding-left: 4px;
        }
        #disp-entero {
            color: var(--color-entero);
        }
        #disp-decimal {
            color: var(--color-decimal);
        }
        .span-punto {
            color: #ddd;
            font-size: 2rem;
            width: 12px;
            text-align: center;
        }
        .euro-sep {
            font-size: 2.2rem;
            opacity: 0.4;
            margin-left: 15px;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr) var(--gap-center) repeat(3, 1fr);
            gap: var(--gap-std) 0;
            padding-bottom: 12px;
        }

        .keyboard-grid button {
            margin: 0 4px;
        }

        button {
            background: var(--key-bg);
            border: none;
            height: 56px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 3px #000;
            color: white;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 0 #000;
        }
        .btn-entero {
            color: var(--color-entero);
        }
        .btn-decimal {
            color: var(--color-decimal);
        }

        .btn-c-integrated {
            grid-column: 2 / 7;
            color: #888;
            font-size: 1.6rem;
            z-index: 2;
        }

        .spacer {
            grid-column: 4;
            width: var(--gap-center);
        }

        /* Ventana emergente de configuración */
        .overlay-config {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;              /* <- ahora oculta por defecto */
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .config-panel {
            background: #111;
            color: #fff;
            border-radius: 12px;
            padding: 16px 18px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            font-size: 0.9rem;
        }

        .config-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .config-title-red {
            color: #ff4b4b;
        }

        .config-block-wrapper {
            display: flex;
            justify-content: center;
        }

        .config-blocks {
            text-align: left;
        }

        .config-block {
            margin-bottom: 10px;
        }

        .config-block-label {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .config-block-text-line {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .config-block-text-line span {
            white-space: nowrap;
        }

        .config-inline-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-inline-row input {
            width: 64px;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #000;
            color: #fff;
            font-size: 0.9rem;
            text-align: right;
            box-sizing: border-box;
        }

        .config-inline-row input[readonly] {
            background: #222;
            font-weight: bold;
        }

        .config-inline-row input.config-input-edit {
            font-weight: bold;
        }

        .config-input-placeholder::placeholder {
            color: #888;
            font-weight: normal;
        }

        .config-unit {
            font-size: 0.9rem;
            min-width: 16px;
            text-align: left;
        }

        .config-question {
            text-align: center;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .config-buttons,
        .config-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .config-buttons button,
        .config-actions button {
            width: 90px;
            height: 36px;
            font-size: 0.9rem;
            box-shadow: none;
            border-radius: 8px;
        }

        .btn-simple {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
        }

        .btn-primary {
            background: #ffb703;
            color: #000;
            border: 1px solid #ffb703;
        }

        .btn-default-filled {
            background: #ffb703;
            color: #000;
            border-color: #ffb703;
        }

        .config-actions {
            margin-top: 16px;
        }
    </style>
</head>
<body>

<!-- Ventana emergente solo para parámetros (usaremos solo el paso 2) -->
<div class="overlay-config" id="configOverlay">
    <div class="config-panel">
        <!-- Paso 1 (parámetros actuales) ya no se usa, lo dejamos oculto -->
        <div id="configStep1" style="display:none;"></div>

        <!-- Paso 2: nuevos parámetros -->
        <div id="configStep2">
            <div class="config-title config-title-red">Nuevos parámetros de la OPERATIVA</div>

            <div class="config-block-wrapper">
                <div class="config-blocks">
                    <!-- PASO 1 -->
                    <div class="config-block">
                        <div class="config-block-label">PASO 1:</div>
                        <div>A la cantidad que introduzcamos</div>
                        <div class="config-block-text-line">
                            <span>le añadiremos un.....</span>
                            <div class="config-inline-row">
                                <input id="inputPorcentaje"
                                       type="text"
                                       inputmode="decimal"
                                       class="config-input-placeholder config-input-edit">
                                <span class="config-unit">%</span>
                            </div>
                        </div>
                    </div>

                    <!-- PASO 2 -->
                    <div class="config-block">
                        <div class="config-block-label">PASO 2:</div>
                        <div>A la cantidad restante</div>
                        <div class="config-block-text-line">
                            <span>le sumaremos..........</span>
                            <div class="config-inline-row">
                                <input id="inputFijo"
                                       type="text"
                                       inputmode="decimal"
                                       class="config-input-placeholder config-input-edit">
                                <span class="config-unit">$</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="config-actions">
                <button class="btn-simple" onclick="cancelEditConfig()">Cancelar</button>
                <button class="btn-primary btn-default-filled" onclick="applyConfig()">Aceptar</button>
            </div>
        </div>
    </div>
</div>

<div class="calc">
    <!-- Bloque discreto con parámetros, arriba y a la izquierda -->
    <div class="operativa-mini">
        <span id="miniPaso1" onclick="openConfigFromMini()">+ 10 %</span>
        <span id="miniPaso2" onclick="openConfigFromMini()">+ 2 $</span>
    </div>

    <div class="display-container">
        <!-- OPERATIVA MATEMÁTICA / RESULTADO -->
        <div id="result-val" class="display-line">
            <div id="res-entero" class="part-entero">0</div>
            <div class="span-punto">.</div>
            <div class="part-decimal">
                <span id="res-decimal">00</span><span class="euro-sep">$</span>
            </div>
        </div>

        <!-- NÚMERO QUE ESTÁS INTRODUCIENDO -->
        <div id="input-val" class="display-line">
            <div id="disp-entero" class="part-entero">0</div>
            <div class="span-punto">.</div>
            <div id="disp-decimal" class="part-decimal">00</div>
        </div>
    </div>

    <div class="keyboard-grid">
        <!-- Filas 1 a 3: Números 1-9 -->
        <button class="btn-entero" onclick="pressE('1')">1</button>
        <button class="btn-entero" onclick="pressE('2')">2</button>
        <button class="btn-entero" onclick="pressE('3')">3</button>
        <div class="spacer"></div>
        <button class="btn-decimal" onclick="pressD('1')">1</button>
        <button class="btn-decimal" onclick="pressD('2')">2</button>
        <button class="btn-decimal" onclick="pressD('3')">3</button>

        <button class="btn-entero" onclick="pressE('4')">4</button>
        <button class="btn-entero" onclick="pressE('5')">5</button>
        <button class="btn-entero" onclick="pressE('6')">6</button>
        <div class="spacer"></div>
        <button class="btn-decimal" onclick="pressD('4')">4</button>
        <button class="btn-decimal" onclick="pressD('5')">5</button>
        <button class="btn-decimal" onclick="pressD('6')">6</button>

        <button class="btn-entero" onclick="pressE('7')">7</button>
        <button class="btn-entero" onclick="pressE('8')">8</button>
        <button class="btn-entero" onclick="pressE('9')">9</button>
        <div class="spacer"></div>
        <button class="btn-decimal" onclick="pressD('7')">7</button>
        <button class="btn-decimal" onclick="pressD('8')">8</button>
        <button class="btn-decimal" onclick="pressD('9')">9</button>

        <!-- Fila Final: 0 - C - 0 -->
        <button class="btn-entero" onclick="pressE('0')">0</button>
        <button class="btn-c-integrated" onclick="resetAll()">C</button>
        <button class="btn-decimal" style="grid-column: 7;" onclick="pressD('0')">0</button>
    </div>
</div>

<script>
    // Parámetros de operativa con valores por defecto (10% y 2 $ mostrados, 0,02 internos)
    let operativaPorcentaje = 10;   // 10 %
    let operativaFijo = 0.02;       // interno, 2 $ / 100

    let entero = "";
    let decimal = "";
    let lastActive = Date.now();
    let calculated = false;

    function u() {
        document.getElementById('disp-entero').innerText = entero || "0";
        document.getElementById('disp-decimal').innerText = decimal.padEnd(2, '0');
        lastActive = Date.now();
    }

    function resetAll() {
        entero = "";
        decimal = "";
        document.getElementById('result-val').style.visibility = 'hidden';
        calculated = false;
        u();
    }

    function pressE(v) {
        if (calculated) resetAll();
        if (entero.length < 3) entero += v;
        u();
    }

    function pressD(v) {
        if (calculated) resetAll();
        if (decimal.length < 2) {
            decimal += v;
            u();
            if (decimal.length === 2) calcular();
        }
    }

    function calcular() {
        const val = parseFloat((entero || "0") + "." + decimal);

        const factor = 1 + (operativaPorcentaje / 100);
        const res = (val * factor) + operativaFijo;

        const parts = res.toFixed(2).split('.');
        document.getElementById('res-entero').innerText = parts[0];
        document.getElementById('res-decimal').innerText = parts[1];
        document.getElementById('result-val').style.visibility = 'visible';
        calculated = true;
    }

    setInterval(() => {
        if (Date.now() - lastActive > 30000) resetAll();
    }, 1000);

    const LS_KEY_PORC = 'calcSpeed_operativaPorcentaje';
    const LS_KEY_FIJO = 'calcSpeed_operativaFijo';

    function cargarDesdeLocalStorage() {
        const p = localStorage.getItem(LS_KEY_PORC);
        const f = localStorage.getItem(LS_KEY_FIJO);

        if (p !== null && !isNaN(parseFloat(p))) {
            operativaPorcentaje = parseFloat(p);
        }
        if (f !== null && !isNaN(parseFloat(f))) {
            operativaFijo = parseFloat(f);
        }
    }

    function guardarEnLocalStorage() {
        localStorage.setItem(LS_KEY_PORC, String(operativaPorcentaje));
        localStorage.setItem(LS_KEY_FIJO, String(operativaFijo));
    }

    function updateMiniOperativa() {
        const miniP = document.getElementById('miniPaso1');
        const miniF = document.getElementById('miniPaso2');

        const porcStr = operativaPorcentaje.toLocaleString('es-ES', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });

        const fijoDolares = operativaFijo * 100;
        const fijoStr = fijoDolares.toLocaleString('es-ES', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });

        miniP.textContent = '+ ' + porcStr + ' %';
        miniF.textContent = '+ ' + fijoStr + ' $';
    }

    // Abrir directamente la ventana de nuevos parámetros al pulsar el mini-bloque
    function openConfigFromMini() {
        const overlay = document.getElementById('configOverlay');
        const step1 = document.getElementById('configStep1');
        const step2 = document.getElementById('configStep2');

        if (step1) step1.style.display = 'none';
        step2.style.display = 'block';
        overlay.style.display = 'flex';

        const inputPorc = document.getElementById('inputPorcentaje');
        const inputFijo = document.getElementById('inputFijo');

        const porcStr = operativaPorcentaje.toLocaleString('es-ES', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });
        const fijoDolares = operativaFijo * 100;
        const fijoStr = fijoDolares.toLocaleString('es-ES', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });

        inputPorc.value = '';
        inputPorc.placeholder = porcStr;
        inputFijo.value = '';
        inputFijo.placeholder = fijoStr;
    }

    function cancelEditConfig() {
        guardarEnLocalStorage();
        updateMiniOperativa();
        document.getElementById('configOverlay').style.display = 'none';
    }

    function applyConfig() {
        const inputPorc = document.getElementById('inputPorcentaje');
        const inputFijo = document.getElementById('inputFijo');

        let pNum = operativaPorcentaje;
        let fNum = operativaFijo;

        let pStr = inputPorc.value.trim();
        let fStr = inputFijo.value.trim();

        if (pStr !== '') {
            pStr = pStr.replace(',', '.');
            const tmpP = parseFloat(pStr);
            if (!isNaN(tmpP)) pNum = tmpP;
        }

        if (fStr !== '') {
            fStr = fStr.replace(',', '.');
            const tmpF_dolares = parseFloat(fStr);
            if (!isNaN(tmpF_dolares)) {
                fNum = tmpF_dolares / 100;
            }
        }

        if (pNum < 0) pNum = 0;
        if (pNum > 100) pNum = 100;

        if (fNum < 0) fNum = 0;
        if (fNum > 1) fNum = 1;

        operativaPorcentaje = pNum;
        operativaFijo = fNum;

        guardarEnLocalStorage();
        updateMiniOperativa();
        document.getElementById('configOverlay').style.display = 'none';
    }

    window.addEventListener('load', () => {
        cargarDesdeLocalStorage();
        updateMiniOperativa();
        // Ya NO mostramos la ventana inicial: se entra directo a la calculadora
    });
</script>

</body>
</html>
